[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citylens-core"
version = "0.2.0"
description = "Citylens reusable pipeline core (local-workdir artifacts, pluggable segmentation backends)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Citylens" }]
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.23",
  "pillow>=10.0",
  "rasterio>=1.3",
  "shapely>=2.0",
  "pyproj>=3.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]
mesh = ["open3d>=0.18"]
sam2 = ["sam-2 @ git+https://github.com/facebookresearch/sam2.git"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
